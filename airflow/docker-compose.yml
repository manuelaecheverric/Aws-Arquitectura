x-airflow-common: &airflow-common
  image: datalake-airflow:local
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    DATALAKE_BUCKET: ${DATALAKE_BUCKET}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    DATALAKE_REPO: /opt/airflow/repo
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../src:/opt/airflow/repo/src
    - ../config:/opt/airflow/repo/config
    - ../sql:/opt/airflow/repo/sql
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    build: .
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow db migrate &&
        /entrypoint airflow users create --username admin --password admin \
          --firstname Admin --lastname Admin --role Admin --email admin@example.com || true
        /entrypoint airflow pools set escritura_datalake 1 "Tareas que escriben en el lake (1 a la vez)"

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
